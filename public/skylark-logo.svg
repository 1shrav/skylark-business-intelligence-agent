<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 400' width='1000' height='400'>
  <defs>
    <linearGradient id='cloudGrad' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' style='stop-color:#3b82f6;stop-opacity:1' />
      <stop offset='100%' style='stop-color:#60a5fa;stop-opacity:1' />
    </linearGradient>
  </defs>
  <!-- Cloud shapes -->
  <ellipse cx='120' cy='150' rx='80' ry='60' fill='url(#cloudGrad)' opacity='0.8'/>
  <ellipse cx='200' cy='130' rx='100' ry='70' fill='url(#cloudGrad)' opacity='0.9'/>
  <ellipse cx='300' cy='140' rx='90' ry='65' fill='url(#cloudGrad)' opacity='0.85'/>
  <!-- Drone icon -->
  <g transform='translate(800, 100)'>
    <path d='M 0 0 L 30 -40 L 60 0 L 50 10 L 40 30 L 20 30 L 10 10 Z' fill='#1e3a8a' opacity='0.9'/>
    <circle cx='15' cy='15' r='8' fill='#1e3a8a'/>
    <circle cx='45' cy='15' r='8' fill='#1e3a8a'/>
  </g>
  <!-- Skylark text -->
  <text x='50' y='250' font-family='cursive' font-size='120' fill='#1e3a8a' font-weight='bold' font-style='italic'>Skylark</text>
</svg>
